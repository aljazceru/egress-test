name: Build signed image for egress-test

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ttl.sh
  IMAGE_NAME: egress-test-a3f9-24h

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:24h
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        # v4.1.2 — installs cosign 3.x, which emits portable DSSE
        # material; legacy 2.x `.sig` objects may lack it
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign (keyless)
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}


      - name: Print manual deploy image
        run: |
          echo "Deploy manually with:"
          echo "enclava deploy --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
